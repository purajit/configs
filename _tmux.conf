set -g default-command 'zsh'
set -g default-terminal "tmux-256color"
# Declare true color for terminals we use; keep native cursor capabilities.
set -s 'terminal-features[10]' 'xterm-ghostty:RGB'
set -s 'terminal-features[11]' 'alacritty:RGB'
set -s 'terminal-features[12]' 'xterm-256color:RGB'

# Switch themes - currently unused; maybe later? Especially to handle talos whites?
set -s theme detect

# Using C-t since I don't find it useful within Emacs
set -g prefix C-t
set -g mouse on

setw -g mode-keys emacs
set -g status-keys emacs

# emacs-style pane management
bind 3 split-window -h -c "#{pane_current_path}"
bind 2 split-window -v -c "#{pane_current_path}"
bind 0 kill-pane

# emacs-style buffer management
bind f new-window
bind n next-window
bind p previous-window
bind k kill-window
bind c kill-session
bind d detach-client
bind r source-file ~/.tmux.conf \; display-message 'config reloaded'

# unbind keys often pressed accidentally that I don't really use
unbind C-o
unbind t

# start window indexing at one instead of zero, and keep numbering up-to-date after one is closed
set -g base-index 1
setw -g history-limit 250000
# not important anymore since it's not part of the window status
set -g renumber-windows on

# we'll handle this ourselves
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none
setw -g monitor-activity on

# message style
set -g message-style 'fg=green,bg=terminal'
setw -ug mode-style
setw -ug tree-mode-selection-style

# statusbar settings
set -g status-position bottom
set -g status-justify left
set -g status-left '#[fg=color239,bg=color214,bold] #[bg=terminal] '
set -g status-right '#[fg=color239,bg=color214,bold] #{network_type_icon} \
#{battery_icon}#{battery_percentage}  #{cpu_percentage}  #{ram_percentage} \
#{?client_prefix,#[bg=red]#[fg=white] #S, #S} '
set -g status-right-length 100
set -g status-interval 5
set -g status-style 'bg=terminal'

# tab information - just current process and number of panes
setw -g window-status-current-format ' #W/#{window_panes} '
setw -g window-status-format ' #W/#{window_panes} '

# tab colors
setw -g window-status-current-style 'fg=color239,bg=color214,bold'
setw -g window-status-activity-style 'bg=#444444,fg=#ffffff'
setw -g window-status-bell-style 'bg=red,fg=#ffffff'
setw -g window-status-style 'bg=#444444,fg=#ffffff'

# two-line status bar to add a gap between terminal elements
# the default statusbar is drawn on the top line, status-format[0]; reset to default so we
# don't need to add a conditional for number of lines and can just start from a known state
set -ug status-format
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[0]' ''
set -g status 2

setw -g window-active-style 'bg=terminal,fg=terminal'
setw -g window-style 'bg=terminal,fg=terminal'

set -g pane-border-style 'fg=color239'
set -g pane-active-border-style 'fg=color214'
set -g pane-border-lines 'single'
set -g pane-border-status 'top'
set -g pane-border-format '#{?pane_active,#[fg=black]#[bg=color214],#[fg=color214]} #{?pane_title,#{pane_title},#{pane_current_command}} '

# plugins
run ~/.tmux/plugins/tmux-cpu/*.tmux

set -g @internet_icon_wifi ''
set -g @internet_icon_ethernet ''
run ~/.tmux/plugins/tmux-wifiorethernet/*.tmux

# disable the messages the default commands display, and swap
# upcase and lowcase behavior - I want to paste by default
set -g @fingers-key 'SPACE'
set -g @fingers-jump-key 'j'
set -g @fingers-pattern-1 '20\d{6}-[a-zA-Z0-9-_.]+' # git branches
set -g @fingers-main-action ':paste:'
set -g @fingers-use-system-clipboard 0
set -g @fingers-highlight-style 'fg=yellow bg=black'
run ~/.tmux/plugins/tmux-fingers/*.tmux

set -g @batt_icon_charge_tier8 '󰁹'
set -g @batt_icon_charge_tier7 '󰂁'
set -g @batt_icon_charge_tier6 '󰂀'
set -g @batt_icon_charge_tier5 '󰁿'
set -g @batt_icon_charge_tier4 '󰁽'
set -g @batt_icon_charge_tier3 '󰁼'
set -g @batt_icon_charge_tier2 '#[fg=maroon]󰁺#[fg=color239]'
set -g @batt_icon_charge_tier1 '#[fg=maroon]󰁺#[fg=color239]'
set -g @batt_icon_status_charged '󰂄'
set -g @batt_icon_status_charging '󱐋'
set -g @batt_icon_status_discharging '󰂌'
set -g @batt_icon_status_unknown '󰂑'
run ~/.tmux/plugins/tmux-battery/*.tmux
